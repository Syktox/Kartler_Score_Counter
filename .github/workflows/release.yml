name: Build And Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.2.3"
        required: true

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"

jobs:
  prepare_release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_notes: ${{ steps.release_notes.outputs.release_notes }}
      release_version: ${{ steps.version.outputs.release_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          if git rev-parse "refs/tags/${RAW_TAG}" >/dev/null 2>&1; then
            TAG_NAME="${RAW_TAG}"
          elif [[ "${RAW_TAG}" != v* ]] && git rev-parse "refs/tags/v${RAW_TAG}" >/dev/null 2>&1; then
            TAG_NAME="v${RAW_TAG}"
          else
            echo "Tag not found: ${RAW_TAG}"
            exit 1
          fi

          RELEASE_VERSION="${TAG_NAME#v}"
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.3 or 1.2.3. Got: ${TAG_NAME}"
            exit 1
          fi

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${BUILD_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "release_name=Release ${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          CURRENT_COMMIT="$(git rev-list -n 1 "${TAG_NAME}")"
          PREVIOUS_TAG="$(git tag --sort=-creatordate | grep -Fxv "${TAG_NAME}" | head -n 1 || true)"

          {
            echo "release_notes<<EOF"
            echo "## Changes"
            echo
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              echo "Commits since ${PREVIOUS_TAG}:"
              echo
              git log "${PREVIOUS_TAG}..${CURRENT_COMMIT}" --pretty=format:'- %s (%h)'
            else
              echo "Initial release commits:"
              echo
              git log "${CURRENT_COMMIT}" --pretty=format:'- %s (%h)' -n 20
            fi
            echo
            echo
            echo "## Artifacts"
            echo
            echo "- Android APK"
            echo "- Android App Bundle"
            echo "- Windows ZIP"
            echo "- macOS ZIP"
            echo "- iOS IPA when Apple signing secrets are configured"
            echo "- iOS unsigned app ZIP when Apple signing secrets are not configured"
            echo
            echo "_Store uploads require the matching platform signing secrets and store metadata outside this workflow._"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  validate_release:
    name: Validate Release
    runs-on: ubuntu-latest
    needs: prepare_release
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare_release.outputs.tag_name }}

      - name: Set pubspec release version
        shell: pwsh
        run: |
          $pubspecVersion = "${{ needs.prepare_release.outputs.release_version }}+${{ needs.prepare_release.outputs.build_number }}"
          $pubspecPath = "pubspec.yaml"
          $content = Get-Content -LiteralPath $pubspecPath -Raw
          if ($content -notmatch "(?m)^version:\s*") {
            throw "Could not find version in pubspec.yaml"
          }
          $content = $content -replace "(?m)^version:\s*.*$", "version: $pubspecVersion"
          Set-Content -LiteralPath $pubspecPath -Value $content -NoNewline
          Write-Host "pubspec.yaml version set to $pubspecVersion"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install latest dependencies
        run: flutter pub upgrade --major-versions

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    needs:
      - prepare_release
      - validate_release
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare_release.outputs.tag_name }}

      - name: Set pubspec release version
        shell: pwsh
        run: |
          $pubspecVersion = "${{ needs.prepare_release.outputs.release_version }}+${{ needs.prepare_release.outputs.build_number }}"
          $pubspecPath = "pubspec.yaml"
          $content = Get-Content -LiteralPath $pubspecPath -Raw
          if ($content -notmatch "(?m)^version:\s*") {
            throw "Could not find version in pubspec.yaml"
          }
          $content = $content -replace "(?m)^version:\s*.*$", "version: $pubspecVersion"
          Set-Content -LiteralPath $pubspecPath -Value $content -NoNewline
          Write-Host "pubspec.yaml version set to $pubspecVersion"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install latest dependencies
        run: flutter pub upgrade --major-versions

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Configure Android release signing
        id: android_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            } > android/key.properties
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Android signing secrets are incomplete. Building unsigned Android release artifacts."
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Android APK
        run: >
          flutter build apk --release
          --build-name=${{ needs.prepare_release.outputs.release_version }}
          --build-number=${{ needs.prepare_release.outputs.build_number }}

      - name: Build Android App Bundle
        run: >
          flutter build appbundle --release
          --build-name=${{ needs.prepare_release.outputs.release_version }}
          --build-number=${{ needs.prepare_release.outputs.build_number }}

      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          SIGNING_LABEL="unsigned"
          if [[ "${{ steps.android_signing.outputs.signed }}" == "true" ]]; then
            SIGNING_LABEL="signed"
          fi

          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/kartler-android-${{ needs.prepare_release.outputs.tag_name }}-${SIGNING_LABEL}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release-assets/kartler-android-${{ needs.prepare_release.outputs.tag_name }}-${SIGNING_LABEL}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release-assets
          path: release-assets/*

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    needs:
      - prepare_release
      - validate_release
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare_release.outputs.tag_name }}

      - name: Set pubspec release version
        shell: pwsh
        run: |
          $pubspecVersion = "${{ needs.prepare_release.outputs.release_version }}+${{ needs.prepare_release.outputs.build_number }}"
          $pubspecPath = "pubspec.yaml"
          $content = Get-Content -LiteralPath $pubspecPath -Raw
          if ($content -notmatch "(?m)^version:\s*") {
            throw "Could not find version in pubspec.yaml"
          }
          $content = $content -replace "(?m)^version:\s*.*$", "version: $pubspecVersion"
          Set-Content -LiteralPath $pubspecPath -Value $content -NoNewline
          Write-Host "pubspec.yaml version set to $pubspecVersion"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install latest dependencies
        run: flutter pub upgrade --major-versions

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows app
        run: >
          flutter build windows --release
          --build-name=${{ needs.prepare_release.outputs.release_version }}
          --build-number=${{ needs.prepare_release.outputs.build_number }}

      - name: Archive Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "release-assets/kartler-windows-${{ needs.prepare_release.outputs.tag_name }}.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: release-assets/*

  build_ios:
    name: Build iOS
    runs-on: macos-latest
    needs:
      - prepare_release
      - validate_release
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare_release.outputs.tag_name }}

      - name: Set pubspec release version
        shell: pwsh
        run: |
          $pubspecVersion = "${{ needs.prepare_release.outputs.release_version }}+${{ needs.prepare_release.outputs.build_number }}"
          $pubspecPath = "pubspec.yaml"
          $content = Get-Content -LiteralPath $pubspecPath -Raw
          if ($content -notmatch "(?m)^version:\s*") {
            throw "Could not find version in pubspec.yaml"
          }
          $content = $content -replace "(?m)^version:\s*.*$", "version: $pubspecVersion"
          Set-Content -LiteralPath $pubspecPath -Value $content -NoNewline
          Write-Host "pubspec.yaml version set to $pubspecVersion"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install latest dependencies
        run: flutter pub upgrade --major-versions

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Install iOS pods
        run: pod install --project-directory=ios

      - name: Configure iOS App Store signing
        id: ios_signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [[ -z "${IOS_CERTIFICATE_BASE64}" || -z "${IOS_CERTIFICATE_PASSWORD}" || -z "${IOS_KEYCHAIN_PASSWORD}" || -z "${IOS_PROVISIONING_PROFILE_BASE64}" || -z "${IOS_EXPORT_OPTIONS_PLIST_BASE64}" ]]; then
            echo "::notice::iOS signing secrets are incomplete. Building unsigned iOS app ZIP instead of App Store IPA."
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/ios_distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/ios_profile.mobileprovision"
          EXPORT_OPTIONS_PATH="${RUNNER_TEMP}/ExportOptions.plist"

          echo "${IOS_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          echo "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"
          echo "${IOS_EXPORT_OPTIONS_PLIST_BASE64}" | base64 --decode > "${EXPORT_OPTIONS_PATH}"

          security create-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(security cms -D -i "${PROFILE_PATH}" | plutil -extract UUID raw - 2>/dev/null || uuidgen)"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "export_options=${EXPORT_OPTIONS_PATH}" >> "${GITHUB_OUTPUT}"
          echo "signed=true" >> "${GITHUB_OUTPUT}"

      - name: Build signed iOS IPA
        if: steps.ios_signing.outputs.signed == 'true'
        run: >
          flutter build ipa --release
          --build-name=${{ needs.prepare_release.outputs.release_version }}
          --build-number=${{ needs.prepare_release.outputs.build_number }}
          --export-options-plist=${{ steps.ios_signing.outputs.export_options }}

      - name: Build unsigned iOS app
        if: steps.ios_signing.outputs.signed != 'true'
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ needs.prepare_release.outputs.release_version }}
          --build-number=${{ needs.prepare_release.outputs.build_number }}

      - name: Collect iOS artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          if [[ "${{ steps.ios_signing.outputs.signed }}" == "true" ]]; then
            cp build/ios/ipa/*.ipa "release-assets/kartler-ios-${{ needs.prepare_release.outputs.tag_name }}-app-store.ipa"
          else
            ditto -c -k --sequesterRsrc --keepParent \
              build/ios/iphoneos/Runner.app \
              "release-assets/kartler-ios-${{ needs.prepare_release.outputs.tag_name }}-unsigned.zip"
          fi

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-assets
          path: release-assets/*

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    needs:
      - prepare_release
      - validate_release
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare_release.outputs.tag_name }}

      - name: Set pubspec release version
        shell: pwsh
        run: |
          $pubspecVersion = "${{ needs.prepare_release.outputs.release_version }}+${{ needs.prepare_release.outputs.build_number }}"
          $pubspecPath = "pubspec.yaml"
          $content = Get-Content -LiteralPath $pubspecPath -Raw
          if ($content -notmatch "(?m)^version:\s*") {
            throw "Could not find version in pubspec.yaml"
          }
          $content = $content -replace "(?m)^version:\s*.*$", "version: $pubspecVersion"
          Set-Content -LiteralPath $pubspecPath -Value $content -NoNewline
          Write-Host "pubspec.yaml version set to $pubspecVersion"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install latest dependencies
        run: flutter pub upgrade --major-versions

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Install macOS pods
        run: pod install --project-directory=macos

      - name: Build macOS app
        run: >
          flutter build macos --release
          --build-name=${{ needs.prepare_release.outputs.release_version }}
          --build-number=${{ needs.prepare_release.outputs.build_number }}

      - name: Archive macOS app
        shell: bash
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Kartler.app \
            "release-assets/kartler-macos-${{ needs.prepare_release.outputs.tag_name }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-assets
          path: release-assets/*

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.validate_release.result == 'success' &&
      needs.build_android.result == 'success' &&
      needs.build_windows.result == 'success' &&
      needs.build_macos.result == 'success' &&
      needs.build_ios.result == 'success'
    needs:
      - prepare_release
      - validate_release
      - build_android
      - build_windows
      - build_macos
      - build_ios
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets

      - name: List release artifacts
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag_name }}
          name: ${{ needs.prepare_release.outputs.release_name }}
          body: ${{ needs.prepare_release.outputs.release_notes }}
          files: release-assets/*
          draft: false
          prerelease: false
